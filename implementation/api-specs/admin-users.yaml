openapi: 3.1.0
info:
  title: JRPay — Admin Users (Operator Administration)
  version: 1.0.0
  description: |
    Operator-user administration surface. Realises UC-G43 —
    SUPERVISOR-driven CRUD on back-office users (list, create,
    change role, suspend / reactivate / delete / unlock) plus the
    per-user activity log (ADM-F93).

    Hosted by the identity service. Every mutation requires step-up
    SCA with dynamic-linking class `admin-action` and the matching
    `AdminAction` value (e.g. `CREATE_OPERATOR`, `UPDATE_OPERATOR_ROLE`,
    `SUSPEND_OPERATOR`, `REACTIVATE_OPERATOR`, `DELETE_OPERATOR`,
    `UNLOCK_OPERATOR`). `notesHash` is SHA-256 over the NFC-normalised
    notes.

    Two-person integrity:
      - ADMIN role assignment (create or promote) requires a second
        SUPERVISOR concurrence — server returns `202
        urn:problem:two-supervisor-required` with an `approvalRef` that
        a second SUPERVISOR submits to `/users/approvals/{ref}`.
      - Self-delete is forbidden (`urn:problem:cannot-delete-self`).

    See `shared-schemas.yaml` for enums + Problem envelope + pagination.

servers:
  - url: "https://admin-api.{env}.jrpay.example"
    variables: { env: { default: dev } }
  - url: "http://localhost:8097"
    description: Local dev (identity service)

tags:
  - name: Admin-Users
    description: CRUD on operator users (UC-G43 §6.1–§6.5)
  - name: Admin-User-Lifecycle
    description: Suspend / reactivate / unlock / delete
  - name: Admin-User-Activity
    description: UC-G43 §6.6 — per-user activity log + CSV export
  - name: Admin-User-Approvals
    description: Two-SUPERVISOR concurrence for ADMIN role assignments

paths:
  #############################################################################
  # CRUD
  #############################################################################
  /api/v1/admin/users:
    get:
      tags: [Admin-Users]
      summary: List operator users (UC-G43 §6.1)
      operationId: listAdminUsers
      security:
        - OAuth2Admin: [users:read]
      parameters:
        - name: role
          in: query
          schema:
            type: array
            items: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "shared-schemas.yaml#/components/schemas/OperatorStatus" }
          style: form
          explode: true
        - name: department
          in: query
          schema: { type: string }
        - name: lastLoginAge
          in: query
          description: Age bucket relative to last login.
          schema:
            type: string
            enum: [D_0_7, D_7_30, D_30_90, OVER_90, NEVER]
        - name: q
          in: query
          description: Substring over name / email / username.
          schema: { type: string }
        - $ref: "shared-schemas.yaml#/components/parameters/PageNumber"
        - $ref: "shared-schemas.yaml#/components/parameters/PageSize"
        - $ref: "shared-schemas.yaml#/components/parameters/SortAsc"
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorUserSummary" }
                  page: { $ref: "shared-schemas.yaml#/components/schemas/PageMeta" }
    post:
      tags: [Admin-Users]
      summary: Create an operator (UC-G43 §6.2)
      description: |
        Creates a new operator user in `PENDING_FIRST_LOGIN` state. A
        temporary password is emailed to the new user; `mustSetupSca` is
        automatically set. Step-up SCA required with
        `action=CREATE_OPERATOR`. If `role=ADMIN`, server returns `202
        urn:problem:two-supervisor-required` and defers creation until a
        second SUPERVISOR approves.
      operationId: createAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperatorRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }
        "202":
          description: urn:problem:two-supervisor-required — ADMIN role requires second approval.
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
        "403":
          description: urn:problem:dynamic-linking-mismatch
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
        "409":
          description: urn:problem:email-in-use
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
        "422":
          description: Validation failure (password policy, email format, …).
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }

  /api/v1/admin/users/{userId}:
    get:
      tags: [Admin-Users]
      summary: Operator detail
      operationId: getAdminUser
      security:
        - OAuth2Admin: [users:read]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Operator detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }
        "404": { $ref: "shared-schemas.yaml#/components/responses/Problem404" }
    patch:
      tags: [Admin-Users]
      summary: Change role (UC-G43 §6.3)
      description: |
        Only `role` is mutable via this endpoint. Step-up SCA with
        `action=UPDATE_OPERATOR_ROLE`. Promoting to ADMIN requires two-
        SUPERVISOR concurrence (see `/approvals`). If the user owns open
        fraud cases or sanctions hits, server returns `409` with the
        counts in `details.openAssignments` — operator confirms by
        including `reassignStrategy` in the body (UC-G43 AF-05).
      operationId: updateAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOperatorRoleRequest" }
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }
        "202":
          description: urn:problem:two-supervisor-required
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
        "409":
          description: |
            Open assignments (UC-G43 AF-05); body may include
            `reassignStrategy` to proceed. Or single-SUPERVISOR risk
            (AF-03).
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
    delete:
      tags: [Admin-User-Lifecycle]
      summary: Soft-delete an operator (UC-G43 §6.4)
      description: |
        Archives the user. Past audit entries remain. Step-up SCA
        required (`action=DELETE_OPERATOR`). Self-delete is forbidden.
      operationId: deleteAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorLifecycleRequest" }
      responses:
        "204":
          description: Deleted.
        "404": { $ref: "shared-schemas.yaml#/components/responses/Problem404" }
        "409":
          description: urn:problem:cannot-delete-self
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }

  #############################################################################
  # Lifecycle (UC-G43 §6.4 / §6.5)
  #############################################################################
  /api/v1/admin/users/{userId}/suspend:
    post:
      tags: [Admin-User-Lifecycle]
      summary: Suspend an operator (UC-G43 §6.4)
      operationId: suspendAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorLifecycleRequest" }
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }
        "403":
          description: urn:problem:dynamic-linking-mismatch
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }
        "409":
          description: |
            Sole-SUPERVISOR risk (UC-G43 AF-03) — double SCA required
            (operator re-submits with `doubleScaConfirmed=true`).
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }

  /api/v1/admin/users/{userId}/reactivate:
    post:
      tags: [Admin-User-Lifecycle]
      summary: Reactivate a suspended operator (UC-G43 §6.4)
      operationId: reactivateAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorLifecycleRequest" }
      responses:
        "200":
          description: Reactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }

  /api/v1/admin/users/{userId}/unlock:
    post:
      tags: [Admin-User-Lifecycle]
      summary: Unlock after lockout (UC-G43 §6.5 — IDS-F07)
      operationId: unlockAdminUser
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorLifecycleRequest" }
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorUserDetail" }

  #############################################################################
  # Activity log (UC-G43 §6.6)
  #############################################################################
  /api/v1/admin/users/{userId}/activity:
    get:
      tags: [Admin-User-Activity]
      summary: Per-operator activity log (UC-G43 §6.6)
      description: |
        Last 90 days by default. PII from related customers is hashed;
        clicking through to a specific reveal requires the caller's own
        UC-G36 reveal right (double-audit). Filters compose with AND.
      operationId: listAdminUserActivity
      security:
        - OAuth2Admin: [users:read, audit:read]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: from
          in: query
          schema: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        - name: to
          in: query
          schema: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        - name: type
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: outcome
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [SUCCESS, FAILURE, REJECTED]
          style: form
          explode: true
        - $ref: "shared-schemas.yaml#/components/parameters/PageNumber"
        - $ref: "shared-schemas.yaml#/components/parameters/PageSize"
        - $ref: "shared-schemas.yaml#/components/parameters/SortAsc"
      responses:
        "200":
          description: Paginated activity.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorActivityEntry" }
                  page: { $ref: "shared-schemas.yaml#/components/schemas/PageMeta" }

  /api/v1/admin/users/{userId}/activity/export:
    post:
      tags: [Admin-User-Activity]
      summary: Async CSV export of the activity log (ADM-F93)
      description: |
        Produces a CSV of the filtered activity. Signed-URL download
        (1-h TTL per `SIGNED_URL_CONVENTIONS.md`). Audited.
      operationId: exportAdminUserActivity
      security:
        - OAuth2Admin: [users:read, audit:read]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorActivityExportRequest" }
      responses:
        "202":
          description: Export queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorActivityExport" }

  /api/v1/admin/users/{userId}/activity/export/{exportId}:
    get:
      tags: [Admin-User-Activity]
      summary: Poll activity-export status
      operationId: getAdminUserActivityExport
      security:
        - OAuth2Admin: [users:read, audit:read]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: exportId
          in: path
          required: true
          schema: { $ref: "shared-schemas.yaml#/components/schemas/Uuid" }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorActivityExport" }
        "404": { $ref: "shared-schemas.yaml#/components/responses/Problem404" }

  #############################################################################
  # Approvals (UC-G43 AF-04)
  #############################################################################
  /api/v1/admin/users/approvals:
    get:
      tags: [Admin-User-Approvals]
      summary: List pending approval requests (ADMIN-role actions)
      description: |
        Returns approval requests a SUPERVISOR can act on — excludes
        requests initiated by the calling SUPERVISOR themselves.
      operationId: listUserApprovals
      security:
        - OAuth2Admin: [users:manage]
      responses:
        "200":
          description: Pending approvals.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorApproval" }

  /api/v1/admin/users/approvals/{approvalRef}:
    get:
      tags: [Admin-User-Approvals]
      summary: Get approval detail
      operationId: getUserApproval
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/ApprovalRef"
      responses:
        "200":
          description: Approval detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorApproval" }
        "404": { $ref: "shared-schemas.yaml#/components/responses/Problem404" }
    post:
      tags: [Admin-User-Approvals]
      summary: Approve or deny (second SUPERVISOR — UC-G43 AF-04)
      description: |
        Step-up SCA required. `approve=true` commits the pending action
        and returns the resulting operator record. `approve=false`
        rejects with an audited reason; initiator is notified.
      operationId: decideUserApproval
      security:
        - OAuth2Admin: [users:manage]
      parameters:
        - $ref: "#/components/parameters/ApprovalRef"
        - $ref: "shared-schemas.yaml#/components/parameters/IdempotencyKey"
        - $ref: "shared-schemas.yaml#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorApprovalDecision" }
      responses:
        "200":
          description: Decision applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorApproval" }
        "403":
          description: |
            Calling SUPERVISOR is the initiator (cannot approve own
            requests) or DL mismatch.
          content:
            application/problem+json:
              schema: { $ref: "shared-schemas.yaml#/components/schemas/Problem" }

components:
  securitySchemes:
    OAuth2Admin:
      $ref: "shared-schemas.yaml#/components/securitySchemes/OAuth2Admin"

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: "shared-schemas.yaml#/components/schemas/Uuid" }
    ApprovalRef:
      name: approvalRef
      in: path
      required: true
      schema: { type: string }

  schemas:
    OperatorUserSummary:
      type: object
      required: [userId, email, name, role, status, createdAt]
      properties:
        userId: { $ref: "shared-schemas.yaml#/components/schemas/Uuid" }
        email:
          type: string
          format: email
          description: |
            Operator email (admin visibility — not PII in the customer
            sense; operators use their corporate email).
        name: { $ref: "shared-schemas.yaml#/components/schemas/Name" }
        role: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
        status: { $ref: "shared-schemas.yaml#/components/schemas/OperatorStatus" }
        department: { type: string }
        createdAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        lastLoginAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        mustSetupSca: { type: boolean }
        emailInviteFailed:
          type: boolean
          description: |
            `true` if the invite email dispatch failed on create; operator
            can resend via a re-invite endpoint (future). Covered by
            UC-G43 §8.

    OperatorUserDetail:
      allOf:
        - $ref: "#/components/schemas/OperatorUserSummary"
        - type: object
          properties:
            scaFactors:
              type: array
              items: { $ref: "shared-schemas.yaml#/components/schemas/ScaFactorType" }
            failedLoginCount24h:
              type: integer
              minimum: 0
              description: |
                Counter feeding the 5-in-24h lockout (IDS-F07). Lockout
                state is reflected in `status=LOCKED`.
            lockedUntil:
              $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant"
            openAssignments:
              type: object
              description: Counts referenced by UC-G43 AF-05.
              properties:
                fraudCases: { type: integer, minimum: 0 }
                sanctionsHits: { type: integer, minimum: 0 }
                gdprRequests: { type: integer, minimum: 0 }
            previousRoles:
              type: array
              description: Chronological history of role changes.
              items:
                type: object
                required: [role, changedAt]
                properties:
                  role: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
                  changedAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
                  changedBy: { type: string }

    CreateOperatorRequest:
      type: object
      required: [email, name, role, notes, confirmedCriteria]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name: { $ref: "shared-schemas.yaml#/components/schemas/Name" }
        role: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
        department:
          type: string
          maxLength: 140
        notes:
          type: string
          minLength: 20
          maxLength: 2000
        confirmedCriteria: { type: boolean }

    UpdateOperatorRoleRequest:
      type: object
      required: [role, notes, confirmedCriteria]
      additionalProperties: false
      properties:
        role: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
        notes:
          type: string
          minLength: 20
          maxLength: 2000
        confirmedCriteria: { type: boolean }
        reassignStrategy:
          description: |
            Action for open assignments (UC-G43 AF-05). `keep` leaves
            assignments untouched; `unassign` returns them to the queue.
          type: string
          enum: [keep, unassign]
          default: keep

    OperatorLifecycleRequest:
      type: object
      required: [notes, confirmedCriteria]
      additionalProperties: false
      description: |
        Shared body for `suspend`, `reactivate`, `unlock`, `delete`.
      properties:
        notes:
          type: string
          minLength: 20
          maxLength: 2000
        confirmedCriteria: { type: boolean }
        doubleScaConfirmed:
          type: boolean
          description: |
            Present on the second call when the operator has re-confirmed
            a sole-SUPERVISOR-risk warning (UC-G43 AF-03).
          default: false

    OperatorActivityEntry:
      type: object
      required: [eventId, at, type, outcome]
      properties:
        eventId: { $ref: "shared-schemas.yaml#/components/schemas/Ulid" }
        at: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        type: { type: string }
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, REJECTED]
        resourceType:
          type: string
          enum: [case, hit, account, payment, audit, gdpr-request, user, banner]
        resourceId: { type: string }
        customerHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Hashed customer id when the action touched a customer (PII
            reveal events, account actions). Deep-link from the UI
            requires the caller's own PII-reveal right.
        field:
          type: string
          description: |
            Present for PII-reveal events (`holderName` / `address` /
            `fodselsnummer`).
        note: { type: string, maxLength: 280 }

    OperatorActivityExportRequest:
      type: object
      additionalProperties: false
      properties:
        from: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        to: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        type:
          type: array
          items: { type: string }
        outcome:
          type: array
          items:
            type: string
            enum: [SUCCESS, FAILURE, REJECTED]
        reason:
          type: string
          maxLength: 280

    OperatorActivityExport:
      type: object
      required: [exportId, status, requestedAt]
      properties:
        exportId: { $ref: "shared-schemas.yaml#/components/schemas/Uuid" }
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, READY, FAILED, EXPIRED]
        requestedAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        readyAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        downloadUrl: { type: string, format: uri }
        downloadExpiresAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        rowCount: { type: integer, minimum: 0 }

    OperatorApproval:
      type: object
      required: [approvalRef, action, initiatedBy, initiatedAt, status]
      properties:
        approvalRef: { type: string }
        action:
          type: string
          description: |
            The pending action. Currently only ADMIN-role transitions
            require approval (UC-G43 AF-04); the enum reserves room for
            future two-person-integrity actions.
          enum:
            - CREATE_OPERATOR_ADMIN
            - UPDATE_OPERATOR_ROLE_ADMIN
        initiatedBy: { type: string }
        initiatedAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        expiresAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }
        status:
          type: string
          enum: [PENDING, APPROVED, DENIED, EXPIRED, WITHDRAWN]
        subjectUserId:
          description: |
            Target operator (existing user for role change, or the
            newly-proposed user id for create).
          $ref: "shared-schemas.yaml#/components/schemas/Uuid"
        proposedRole: { $ref: "shared-schemas.yaml#/components/schemas/OperatorRole" }
        notesSummary: { type: string, maxLength: 140 }
        notesHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        decidedBy: { type: string }
        decidedAt: { $ref: "shared-schemas.yaml#/components/schemas/Iso8601Instant" }

    OperatorApprovalDecision:
      type: object
      required: [approve, notes]
      additionalProperties: false
      properties:
        approve: { type: boolean }
        notes:
          type: string
          minLength: 20
          maxLength: 2000
