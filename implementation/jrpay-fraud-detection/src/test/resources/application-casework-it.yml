spring:
  application:
    name: jrpay-fraud-detection-casework-it
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    listener:
      auto-startup: false

server:
  port: 0
management:
  server:
    port: 0

jrpay:
  fraud:
    jwt:
      jwks-uri: http://localhost:8097/oauth2/jwks
    identity:
      base-url: http://localhost:8097
      client-id: jrpay-a5-service
      client-secret: a5-service-secret
    kafka:
      group-id: jrpay-fraud-detection-test
      fraud-check-response-topic: payment.fraud-check-response
      sanctions-topic: sanctions.hits
      auto-startup: false
    case:
      sla: PT4H
    sanctions:
      sla: PT2H
    bulk-decide:
      cooldown: PT1M
    fp-cache:
      ttl-days: 90
    stream:
      ttl: PT5M
      heartbeat-ms: 60000

logging:
  level:
    root: WARN
    com.jrpay: INFO
    org.flywaydb: INFO
