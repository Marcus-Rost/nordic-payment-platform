spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      missing-topics-fatal: false

server:
  port: 0

management:
  server:
    port: -1

jrpay:
  notifications:
    sse:
      stream-token-ttl: PT5M
      idle-timeout: PT1M

logging:
  level:
    root: WARN
    com.jrpay: INFO
