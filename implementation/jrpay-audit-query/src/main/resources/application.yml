spring:
  application:
    name: jrpay-audit-query

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/audit
    username: ${DB_USER:jrpay}
    password: ${DB_PASSWORD:jrpay}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: jrpay-audit-query
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
      missing-topics-fatal: false

server:
  port: 8099

management:
  server:
    port: 9099
  endpoints:
    web:
      exposure:
        include: health,readiness,prometheus

jrpay:
  audit:
    kafka:
      topic: audit.events
    chain:
      checkpoint-batch-size: 1000
      verify-max-events: 100000
    search:
      hard-cap: 10000
      default-window-hours: 24
    export:
      max-rows: 100000
      signed-url-ttl: PT1H
      signing-key: ${AUDIT_EXPORT_SIGNING_KEY:devonly-32-bytes-hmac-secret-key!!}
      signed-base-url: ${AUDIT_EXPORT_BASE_URL:http://localhost:8099/api/v1/admin/audit/export-bin}
