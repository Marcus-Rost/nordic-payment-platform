# JRPay Admin Web — production nginx config.
#
# Responsibilities:
#   - serve the Vite-built SPA from /usr/share/nginx/html;
#   - SPA fallback so /fraud, /accounts/:id, etc. resolve to /index.html;
#   - reverse-proxy every backend admin surface so the SPA stays same-origin
#     (CSP friendliness, no preflights for simple GETs);
#   - emit the GUI-SEC-03 security headers (CSP, X-Frame, Referrer, …);
#   - SSE-friendly proxy: buffering off, longer read timeout, chunked encoding
#     preserved.
#
# Compose hostnames (see docker/docker-compose.yml):
#   identity         : 8097  (oauth2 + sca + users)
#   account-ledger   : 8091  (accounts, payments, gdpr, reconciliation)
#   fraud-detection  : 8095  (fraud + sanctions case projection)
#   audit-query      : 8099
#
# proxy_pass uses runtime-evaluated variables + a Docker DNS resolver so the
# container starts even when an upstream is down or not yet present (nginx
# would otherwise refuse to start). 502 is returned per request when the
# upstream is unreachable.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers (GUI-SEC-03) ───────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # CSP — strict, no eval, no inline JS. Inline styles are allowed because
    # Vite's preload-helper emits a small inline `<style>`; if the team
    # later switches to nonces this directive can tighten further.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ─── Static assets ────────────────────────────────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ─── Identity ─────────────────────────────────────────────────────────
    location /oauth2/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /sca/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /.well-known/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
    }
    location /api/v1/admin/users {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Account ledger ───────────────────────────────────────────────────
    location /api/v1/admin/accounts {
        set $upstream_ledger http://account-ledger:8091;
        proxy_pass $upstream_ledger;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/payments {
        set $upstream_ledger http://account-ledger:8091;
        proxy_pass $upstream_ledger;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/gdpr {
        set $upstream_ledger http://account-ledger:8091;
        proxy_pass $upstream_ledger;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/reconciliation {
        set $upstream_ledger http://account-ledger:8091;
        proxy_pass $upstream_ledger;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Fraud detection (fraud + sanctions queues + SSE) ─────────────────
    # SSE endpoints — keep the connection open with no buffering.
    location ~* ^/api/v1/admin/(fraud|sanctions)/.*/stream {
        set $upstream_fraud http://fraud-detection:8095;
        proxy_pass $upstream_fraud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }
    location /api/v1/admin/fraud {
        set $upstream_fraud http://fraud-detection:8095;
        proxy_pass $upstream_fraud;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/admin/sanctions {
        set $upstream_fraud http://fraud-detection:8095;
        proxy_pass $upstream_fraud;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Audit ────────────────────────────────────────────────────────────
    location /api/v1/admin/audit {
        set $upstream_audit http://audit-query:8099;
        proxy_pass $upstream_audit;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── System health / status banners ───────────────────────────────────
    # No backend currently serves these in compose; the SPA receives a 502
    # until a status-aggregator service joins the stack. The location blocks
    # are kept so adding the service later requires no nginx change.
    location /api/v1/admin/system {
        return 502 "system aggregator not deployed in this stack";
        default_type text/plain;
    }
    location /api/v1/admin/status {
        return 502 "status aggregator not deployed in this stack";
        default_type text/plain;
    }
    location /api/v1/public/status {
        default_type application/json;
        return 200 '{"banners":[]}';
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
