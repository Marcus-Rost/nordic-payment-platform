# JRPay Client Web — production nginx config.
#
# Responsibilities:
#   - serve the Vite-built SPA from /usr/share/nginx/html;
#   - SPA fallback so /accounts/:id, /payments, etc. resolve to /index.html;
#   - reverse-proxy every backend customer surface so the SPA stays same-origin;
#   - emit the GUI-SEC-03 security headers (CSP, X-Frame, Referrer, …);
#   - SSE-friendly proxy: buffering off, longer read timeout.
#
# Compose hostnames (see docker/docker-compose.yml):
#   identity         : 8097  (oauth2 + sca + profile + customer-users)
#   account-ledger   : 8091  (accounts, payments, beneficiaries, gdpr exports)
#   bill-payment     : 8093  (mandates + R2P)
#   psd2-api         : 8094  (consents, VRP)
#   notifications    : 8098
#
# proxy_pass uses runtime-evaluated variables + Docker's 127.0.0.11 DNS resolver
# so the container starts even when an upstream is down.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers (GUI-SEC-03) ───────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ─── Static assets ────────────────────────────────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ─── Identity ─────────────────────────────────────────────────────────
    location /oauth2/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /sca/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /.well-known/ {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
    }
    location /api/v1/customer/profile {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/customer/privacy {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── PSD2-api hosts the customer-facing /accounts and /payments ───────
    # (the OAuth-style read paths + payment-initiation flow). NOT account-
    # ledger — A1 only exposes the admin REST surface and the legacy demo
    # /api/v1/accounts/* path. Customer reads/writes go through psd2-api.
    location /api/v1/customer/accounts {
        set $upstream_psd2 http://psd2-api:8094;
        proxy_pass $upstream_psd2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/customer/payments {
        set $upstream_psd2 http://psd2-api:8094;
        proxy_pass $upstream_psd2;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/customer/beneficiaries {
        set $upstream_billpay http://bill-payment:8093;
        proxy_pass $upstream_billpay;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    # /customer/gdpr — no controller exists yet (would live in identity or
    # account-ledger). Proxy to identity so a future implementation has a
    # natural home; for now these paths surface as clean 404 via OPEN-10.
    location /api/v1/customer/gdpr {
        set $upstream_identity http://identity:8097;
        proxy_pass $upstream_identity;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Bill-payment (mandates + R2P + SSE) ──────────────────────────────
    location ~* ^/api/v1/customer/(r2p|mandates)/.*/stream {
        set $upstream_billpay http://bill-payment:8093;
        proxy_pass $upstream_billpay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }
    location /api/v1/customer/mandates {
        set $upstream_billpay http://bill-payment:8093;
        proxy_pass $upstream_billpay;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/customer/r2p {
        set $upstream_billpay http://bill-payment:8093;
        proxy_pass $upstream_billpay;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── PSD2 (consents + VRP) ────────────────────────────────────────────
    location /api/v1/customer/consents {
        set $upstream_psd2 http://psd2-api:8094;
        proxy_pass $upstream_psd2;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Notifications ────────────────────────────────────────────────────
    location /api/v1/customer/notifications {
        set $upstream_notifications http://notifications:8098;
        proxy_pass $upstream_notifications;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ─── Public status (UC-G54 SSE) ───────────────────────────────────────
    location /api/v1/public/status {
        default_type application/json;
        return 200 '{"banners":[]}';
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
